name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # rebuild weekly so upstream weechat / debian security updates get picked up
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      weechat_image:
        description: "Upstream weechat-container image to build on"
        default: "weechat/weechat:latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # upstream weechat/weechat images are published for amd64 only
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Build once into the local docker daemon and smoke-test it before push.
      - name: Build (test image)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: weechat-ssh:test
          build-args: |
            WEECHAT_IMAGE=${{ inputs.weechat_image || 'weechat/weechat:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (ssh in and check weechat is running in tmux)
        run: ./test/smoke-test.sh weechat-ssh:test

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WEECHAT_IMAGE=${{ inputs.weechat_image || 'weechat/weechat:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
