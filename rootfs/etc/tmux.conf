# tmux defaults for the weechat session.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,alacritty:Tc,*256col*:Tc"

set -g mouse on
set -g history-limit 20000
set -sg escape-time 10
set -g focus-events on
set -g status off
setw -g aggressive-resize on

# weechat owns most of the keyboard; move the prefix out of its way.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Detach without leaving weechat: prefix + d (or ctrl-a d).
bind d detach-client
